name: Sync Dota portrait descriptors

on:
  push:
    paths:
      - ".github/workflows/dota-portraits.yml"
      - "dota-build-assistant/scripts/build-portrait-features.py"
      - "dota-build-assistant/data/heroes.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow requests
      - run: python dota-build-assistant/scripts/build-portrait-features.py
      - name: Commit descriptor data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dota-build-assistant/data/portrait-features.json dota-build-assistant/data/portrait-compact.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Dota portrait descriptors"
            git push
          fi
